name: Dealflow feed

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Score today's new companies
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 dealflow_engine.py \
            --batch summer-2026,fall-2026 \
            --show-hn \
            --include-existing \
            --llm-rescore --top-k 25 \
            --html-out docs/index.html

      - name: Post Slack digest
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          python3 dealflow_engine.py \
            --batch summer-2026,fall-2026 \
            --show-hn \
            --slack-webhook "$SLACK_WEBHOOK"

      - name: Commit updated feed + snapshots
        run: |
          git config user.name "dealflow-bot"
          git config user.email "actions@github.com"
          git add docs/ data/ dealflow_latest.csv
          git commit -m "Daily feed update $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          git push
